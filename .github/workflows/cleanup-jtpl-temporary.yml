name: Cleanup temporary jTPLlKbqTuM retrieval files

on:
  push:
    paths:
      - '.github/workflows/cleanup-jtpl-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove files created for this one-off retrieval
        shell: bash
        run: |
          set -euo pipefail
          candidates=$(mktemp)
          printf '%s\n' \
            '.github/workflows/fetch-jtpllkbqtum.yml' \
            'tmp/fetch_jtpl.py' \
            'tmp/jTPLlKbqTuM-trigger.txt' \
            '.github/workflows/cleanup-jtpl-temporary.yml' >> "$candidates"

          for sha in \
            e62a2be6d5a304b3a2451a850cea934bcf9e45ba \
            694eddb3932bc15e9dc761f13610d9dcb0f8dc6f \
            2f02eae87b314f40adccc1916afde18562052649 \
            7a1b9be6ef9f856a8b8095a26e7d6e4c08a76a2c; do
            git show --pretty='' --name-only "$sha" 2>/dev/null | grep -E '^(tmp/|\.github/workflows/)' >> "$candidates" || true
          done

          sort -u "$candidates" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -rf --ignore-unmatch "$path"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary transcript retrieval files' || true
          git push origin HEAD:master

      - name: Remove temporary branches
        if: always()
        run: |
          git push origin --delete tmp/transcript-output || true
          git push origin --delete tmp/fetch-jtpllkbqtum || true
