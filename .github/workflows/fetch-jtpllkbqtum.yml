name: Temporary fetch jTPLlKbqTuM transcript

on:
  push:
    paths:
      - '.github/workflows/fetch-jtpllkbqtum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade yt-dlp youtube-transcript-api requests

      - name: Run every temporary transcript probe
        continue-on-error: true
        run: |
          mkdir -p out
          found=0
          while IFS= read -r -d '' f; do
            echo "Running $f"
            python "$f" || true
            found=1
          done < <(find tmp -maxdepth 1 -type f \( -iname '*jtpl*.py' -o -iname '*probe*.py' \) -print0)
          echo "found=$found"

      - name: Inventory outputs
        if: always()
        run: find out -maxdepth 4 -type f -printf '%p\t%s bytes\n' | sort | tee out/inventory.txt

      - name: Publish outputs to temporary branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan tmp/transcript-output
          git rm -rf .
          mkdir -p transcript-output
          cp -a out/. transcript-output/ || true
          git add transcript-output
          git commit -m 'Temporary transcript extraction output' || true
          git push --force origin HEAD:refs/heads/tmp/transcript-output

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jtpllkbqtum-transcript
          path: out
          if-no-files-found: warn
          retention-days: 1
